name: Lean proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-apsp:
    name: Complete APSP theorem
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - name: Check out the proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Lean and cached Mathlib dependencies
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: verified
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Build the complete word-RAM proof with bounded parallelism
        working-directory: verified
        run: python3 scripts/build_sequential.py
      - name: Verify the exact statement, source pins, and transitive axioms
        working-directory: verified
        run: python3 verify.py

  verify:
    name: Faster conditional bound certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 4
    steps:
      - name: Check out the proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the Lean development
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Audit transitive axioms
        working-directory: lean
        run: lake env lean Audit.lean
      - name: Reproduce the independent rational certificate
        run: |
          python3 verify_certificate.py --json /tmp/apsp-certificate.json > /tmp/apsp-verification.txt
          diff -u certificate.json /tmp/apsp-certificate.json
          diff -u verification.txt /tmp/apsp-verification.txt
